<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazing App</title>

    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js"
            },
            "integrity": {
                "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js": "sha384-Q3gg1uvxzo7j5a5zJyKw57OkLMyOhl1sGmQxxn63S3lsr8Ki3ACSKKSvK8zG//7D"
            }
        }
    </script>

    <script type="module">
        import { createApp, ref } from "vue";

        const app = {
            setup() {
                const highest = ref(undefined);

                function handleRandom(randomNumber) {
                    if (highest.value) {
                        if (highest.value < randomNumber) {
                            highest.value = randomNumber;
                        }
                    }
                    else {
                        highest.value = randomNumber;
                    }
                }

                return { highest, handleRandom };
            },
        }

        const vueApp = createApp(app);

        vueApp.component('list-component', {
            props: ["buttonText"],
            emits: ["new-number"],
            setup(props, context) {
                const list = ref([]);

                function addItem(evt) {
                    let rand = Math.random();
                    list.value.push(String(rand));

                    // here we emit a custom event
                    context.emit('new-number', rand);
                }

                return { list, addItem };
            },
            template: `<div>
                            <input type="button" :value="buttonText" @click="addItem">
                            <ul>
                                <li v-for="item of list">{{item}}</li>
                            </ul>
                        </div>`
        })

        vueApp.mount("#app")
    </script>

</head>

<body>
    <div id="app">
        <p>Highest number: {{highest}}</p>
        <list-component button-text="Add A" @new-number="handleRandom">
        </list-component>
        <list-component button-text="Add B" @new-number="handleRandom">
        </list-component>
        <list-component button-text="Add C" @new-number="handleRandom">
        </list-component>
    </div>
</body>

</html>
