<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazing App</title>
    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js"
            },
            "integrity": {
                "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js": "sha384-Q3gg1uvxzo7j5a5zJyKw57OkLMyOhl1sGmQxxn63S3lsr8Ki3ACSKKSvK8zG//7D"
            }
        }
    </script>

    <script type="module">
        import { createApp, ref } from "vue";

        const listComponent = {
            name: "ListComponent",
            setup() {
                const list = ref([]);

                function addItem(evt) {
                    let text = String(Math.random());
                    list.value.push(text);
                }

                return { list, addItem };
            },
            template: `<div>
                          <input type="button" value="Add random number" @click="addItem">
                          <ul>
                              <li v-for="item of list">{{item}}</li>
                          </ul>
                       </div>`
        }

        const app = {}

        const vueApp = createApp(app)

        vueApp.component('list-component', listComponent)

        vueApp.mount("#app")
    </script>

</head>

<body>
    <div id="app">
        <h1>Amazing numbers</h1>

        <list-component></list-component>
        <list-component></list-component>
        <list-component></list-component>
        <list-component></list-component>
    </div>
</body>

</html>
