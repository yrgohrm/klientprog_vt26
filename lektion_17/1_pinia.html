<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piñia</title>
    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js",
                "@vue/devtools-api": "https://unpkg.com/@vue/devtools-api@8.0.7/dist/vue-devtools-api.esm-browser.js",
                "vue-router": "https://unpkg.com/vue-router@5.0.3/dist/vue-router.esm-browser.js",
                "pinia": "https://unpkg.com/pinia@3.0.3/dist/pinia.esm-browser.js"
            },
            "integrity": {
                "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js": "sha384-Q3gg1uvxzo7j5a5zJyKw57OkLMyOhl1sGmQxxn63S3lsr8Ki3ACSKKSvK8zG//7D",
                "https://unpkg.com/vue-router@5.0.3/dist/vue-router.esm-browser.js": "sha384-UCfYoTvC3Ge4kIjMsXVb/zUyh739joJtPvBUMOLufZXFnxckxP3w4ByLY9kl/LQc",
                "https://unpkg.com/@vue/devtools-api@8.0.7/dist/vue-devtools-api.esm-browser.js": "sha384-Qk1RVG/J/mO20uVwEEfOAzrJ8nRycY3Kp/5LC9M6AC4xMMy5aFUZ8sfrSfiSdTCO",
                "https://unpkg.com/pinia@3.0.3/dist/pinia.esm-browser.js": "sha384-MG8tPfaMFfzOUzhVR8XpsYwu5LU/rWvNgEwgKHVClwp7AriPC5drTDIyd54w8UFJ"
            }
        }
    </script>
    <script type="module">
        import { createApp, ref } from "vue";
        import { createPinia, defineStore } from "pinia";

        // We always name the store definitions "useXxxxStore"
        const useCounterStore = defineStore("counter", () => {
            const count = ref(0);
            return { count };
        });

        const app = {
            setup() {
                // When we need to use a store, we create it from the
                // store definition
                const counterStore = useCounterStore();

                // We can use the store here as well in watches etc.

                return { counterStore };
            }
        };

        const vueApp = createApp(app);
        vueApp.use(createPinia());
        vueApp.mount("#app");
    </script>
</head>

<body>
    <div id="app">
        <div>{{ counterStore.count }}</div>
        <input type="button" @click="counterStore.count++" value="Increment">
    </div>
</body>

</html>
