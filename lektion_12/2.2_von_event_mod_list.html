<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #app {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js"
            },
            "integrity": {
                "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js": "sha384-Q3gg1uvxzo7j5a5zJyKw57OkLMyOhl1sGmQxxn63S3lsr8Ki3ACSKKSvK8zG//7D"
            }
        }
    </script>

    <script type="module">
        import { createApp, ref } from "vue";

        const app = {
            setup() {
                const stuff = ref(["hej", "hallå", "hejsan"]);

                /**
                 * @param {PointerEvent} event - the event 
                 */
                function removeStuff(str) {
                    const idx = stuff.value.indexOf(str); 
                    stuff.value.splice(idx, 1);
                }

                return { stuff, removeStuff };
            }
        }

        createApp(app).mount("#app");
    </script>
</head>

<body>
    <div id="app">

        <div v-for="s of stuff">
            {{ s }}
            <input type="button" value="remove" @click="removeStuff(s)">
        </div>
    </div>
</body>

</html>
