<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js"
            },
            "integrity": {
                "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js": "sha384-Q3gg1uvxzo7j5a5zJyKw57OkLMyOhl1sGmQxxn63S3lsr8Ki3ACSKKSvK8zG//7D"
            }
        }
    </script>

    <script type="module">
        import { createApp, onMounted, ref, useTemplateRef } from "vue";

        const app = {
            setup() {
                const messages = useTemplateRef("messages");
                const message = ref("");

                fetch("https://yrgo-web-services.netlify.app/fortunes/short")
                    .then(resp => resp.json())
                    .then(json => message.value = json.fortune);

                onMounted(() => messages.value.append("Hello!"));

                return { message };
            }
        }

        createApp(app).mount("#app");
    </script>
</head>

<body>

    <div id="app">
        {{ message }}
        <div ref="messages"></div>
    </div>

</body>

</html>
