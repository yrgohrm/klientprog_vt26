<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --fg-color: black;
            --bg-color: antiquewhite;
        }

        div {
            color: var(--fg-color);
            background-color: var(--bg-color);
        }

        .inverted {
            color: var(--bg-color);
            background-color: var(--fg-color);
        }

        .foobar {
            --bg-color: violet;
            --fg-color: black;
        }
    </style>
</head>

<body>

    <div>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quos, quae?</div>
    <div class="inverted">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quos, quae?</div>
    <div class="foobar">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quos, quae?</div>

</body>

</html>
