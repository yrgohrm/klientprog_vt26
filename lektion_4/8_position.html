<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        p {
            position: relative;
            top: 200px;
            right: 40px;
        }

        img {
            width: 50px;
        }

        .corner {
            width: 50px;
            position: absolute;
            right: 0;
            bottom: 0;
        }

        .abox {
            border: 1px solid red;
            position: relative;
            width: 150px;
            height: 150px;

            img {
                position: absolute;
                bottom: 0;
                right: 0;
            }
        }

    </style>
</head>
<body>
    <h1>En fin sida</h1>

    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Accusantium in
    neque tempore omnis vel debitis laboriosam, earum eos enim rem.</p>

    <img src="3958.png" alt="" class="corner">
    
    <div class="abox">
        <img src="3958.png" alt="">
    </div>
</body>
</html>
