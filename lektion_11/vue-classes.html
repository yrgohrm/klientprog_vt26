<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js"
            },
            "integrity": {
                "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js": "sha384-Q3gg1uvxzo7j5a5zJyKw57OkLMyOhl1sGmQxxn63S3lsr8Ki3ACSKKSvK8zG//7D"
            }
        }
    </script>

    <script type="module">
        import { createApp, ref } from "vue";

        const app = {
            setup() {
                const classes = ref([]);

                setTimeout(() => {
                    classes.value.push("red");
                }, 2000);

                setTimeout(() => {
                    classes.value.push("bold");
                }, 4000);

                return { classes };
            }
        }

        createApp(app).mount("#app");
    </script>

    <style>
        .red {
            background-color: rgb(222, 193, 193);
        }

        .bold {
            font-weight: bolder;
        }
    </style>
</head>

<body>
    <div id="app">
        <div :class="classes">
            hejsan hoppsan
        </div>
    </div>
</body>

</html>
