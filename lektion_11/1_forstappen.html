<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- namnge bibliotek, var de kan laddas ner och deras kryptografiska hash för säkerhet -->
    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js"
            },
            "integrity": {
                "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js": "sha384-Q3gg1uvxzo7j5a5zJyKw57OkLMyOhl1sGmQxxn63S3lsr8Ki3ACSKKSvK8zG//7D"
            }
        }
    </script>

    <script type="module">
        import { createApp, ref } from "vue";

        const app = {
            // i setup() initierar vi vår applikation
            setup() {
                const message = ref("Hello, world!");
                return { message }
            }
        }

        createApp(app).mount("#app")
    </script>
</head>

<body>
    <div id="app">
        {{ message }}
    </div>
</body>

</html>
