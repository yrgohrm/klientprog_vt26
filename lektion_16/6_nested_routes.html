<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested routes</title>
    <style>
        nav * {
            margin: 0.3em;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js",
                "@vue/devtools-api": "https://unpkg.com/@vue/devtools-api@8.0.7/dist/vue-devtools-api.esm-browser.js",
                "vue-router": "https://unpkg.com/vue-router@5.0.3/dist/vue-router.esm-browser.js"
            },
            "integrity": {
                "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js": "sha384-Q3gg1uvxzo7j5a5zJyKw57OkLMyOhl1sGmQxxn63S3lsr8Ki3ACSKKSvK8zG//7D",
                "https://unpkg.com/vue-router@5.0.3/dist/vue-router.esm-browser.js": "sha384-UCfYoTvC3Ge4kIjMsXVb/zUyh739joJtPvBUMOLufZXFnxckxP3w4ByLY9kl/LQc",
                "https://unpkg.com/@vue/devtools-api@8.0.7/dist/vue-devtools-api.esm-browser.js": "sha384-Qk1RVG/J/mO20uVwEEfOAzrJ8nRycY3Kp/5LC9M6AC4xMMy5aFUZ8sfrSfiSdTCO"
            }
        }
    </script>
    <script type="module">
        import { createApp } from "vue"
        import { createRouter, createWebHashHistory } from "vue-router"

        const Home = {
            template: '<p>My Shop</p>'
        }

        const Product = {
            template: `<div>
                            <h1>Product: {{$route.params.product_id}}</h1>

                            <div style="width: 50%; background-color: white;">
                                <router-view></router-view>
                            </div>
                       </div>`
        }

        const Info = {
            template: `<p>Info about {{$route.params.product_id}}</p>
            <router-link to="/product/someproduct/accessories">Go to accessories</router-link>
            `
        }

        const Accessories = {
            template: `<p>Accessories to {{$route.params.product_id}}</p>
            <router-link to="/product/someproduct/info">Go to info</router-link>`
        }

        const router = createRouter({
            history: createWebHashHistory(),
            routes: [
                {
                    path: '/',
                    component: Home
                },
                {
                    path: '/product/:product_id',
                    component: Product,
                    children: [
                        {
                            path: 'info',
                            component: Info
                        },
                        {
                            path: 'accessories',
                            component: Accessories
                        }
                    ]
                }]
        })

        const app = {}

        const vueApp = createApp(app)
        vueApp.use(router)
        vueApp.mount("#app")

    </script>
</head>

<body>
    <div id="app">
        <nav>
            <router-link to="/">Home</router-link>
            <router-link to="/product/someproduct/info">Info</router-link>
            <router-link to="/product/someproduct/accessories">Access</router-link>
        </nav>

        <div style="width: 50%; background-color: grey; border: 1px solid purple;">
            <router-view></router-view>
        </div>

    </div>
</body>

</html>
