<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch</title>
    <style>
        nav * {
            margin: 0.3em;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js",
                "@vue/devtools-api": "https://unpkg.com/@vue/devtools-api@8.0.7/dist/vue-devtools-api.esm-browser.js",
                "vue-router": "https://unpkg.com/vue-router@5.0.3/dist/vue-router.esm-browser.js"
            },
            "integrity": {
                "https://unpkg.com/vue@3.5.28/dist/vue.esm-browser.js": "sha384-Q3gg1uvxzo7j5a5zJyKw57OkLMyOhl1sGmQxxn63S3lsr8Ki3ACSKKSvK8zG//7D",
                "https://unpkg.com/vue-router@5.0.3/dist/vue-router.esm-browser.js": "sha384-UCfYoTvC3Ge4kIjMsXVb/zUyh739joJtPvBUMOLufZXFnxckxP3w4ByLY9kl/LQc",
                "https://unpkg.com/@vue/devtools-api@8.0.7/dist/vue-devtools-api.esm-browser.js": "sha384-Qk1RVG/J/mO20uVwEEfOAzrJ8nRycY3Kp/5LC9M6AC4xMMy5aFUZ8sfrSfiSdTCO"
            }
        }
    </script>
    <script type="module">
        import { createApp, onMounted, watch } from "vue"
        import { createRouter, createWebHashHistory, onBeforeRouteUpdate, useRoute } from "vue-router"

        const Home = { template: '<p>my home page</p>' }
        const Product = {
            props: ['productId'],
            template: '<p>{{productId}}</p>',
            setup(props) {
                console.log("created")

                onMounted(() => console.log("mounted"))

                watch(() => props.productId,
                      (to, from) => console.log(`props changed from ${from} to ${to}`)
                )

                const route = useRoute()
                watch(() => route.params.productId,
                      (to, from) => console.log(`route param changed from ${from} to ${to}`)
                )

                onBeforeRouteUpdate(async (to, from) => {
                    console.log(`before route changed from ${from.params.productId} to ${to.params.productId}`)

                    // in a navigational guard we can cancel navigation!
                    if (to.params.productId === "99") {
                        return false;
                    }
                })
            },
        }

        const router = createRouter({
            history: createWebHashHistory(),
            routes: [
                { path: '/', component: Home },
                { path: '/product/:productId', component: Product, props: true }
            ]
        })

        const app = {}

        const vueApp = createApp(app)
        vueApp.use(router)
        vueApp.mount("#app")
    </script>
</head>

<body>
    <div id="app">
        <nav>
            <router-link to="/">Home</router-link>
            <router-link to="/product/22">Product 22</router-link>
            <router-link to="/product/50">Product 50</router-link>
            <router-link to="/product/99">Product 99</router-link>
        </nav>
        <router-view></router-view>
    </div>
</body>

</html>
